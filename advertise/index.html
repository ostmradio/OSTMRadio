    <!-- JavaScript code -->

		<script>
			async function submitForm() {
			const form = document.getElementById("advertise-form");
			const submitButton = form.querySelector('button[type="submit"]');

			const workerUrl =
			"https://ostm-advertising.floral-mud-bab1.workers.dev/";

			// Collect advertising form information
			const payload = {
			name: document.getElementById("name").value.trim(),
			email: document.getElementById("email").value.trim(),
			objective: document.getElementById("objective").value.trim(),
			targetAudience: document.getElementById("target-audience").value.trim(),
			preferredChannel: document.getElementById("preferred-channel").value.trim(),
			duration: document.getElementById("duration").value.trim(),
			budget: document.getElementById("budget").value.trim(),
			additionalInformation: document.getElementById("additional-information").value.trim()
			};

			// Prevent duplicate submissions
			submitButton.disabled = true;
			submitButton.textContent = "Submitting...";

			try {
			// Send submission to Cloudflare Worker
			const response = await fetch(workerUrl, {
			method: "POST",
			headers: {
			"Content-Type": "application/json"
			},
			body: JSON.stringify(payload)
			});

			const result = await response.json();

			// Check that Discord accepted the submission
			if (!response.ok || !result.success) {
			throw new Error(
			result.error || "Submission failed."
			);
			}

			// Hide form and display success message
			form.style.display = "none";

			document.getElementById("form-sent-text")
			.style.display = "block";

			} catch (error) {
			console.error("Advertising submission error:", error);

			alert(
			"Sorry, your advertising enquiry could not be sent. " +
			"Please try again later.\n\n" +
			error.message
			);

			// Re-enable submission button
			submitButton.disabled = false;
			submitButton.textContent = "Submit";
			}
			}
		</script>
